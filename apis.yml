        url: https://trestle-documentation.corelogic.com/webapi.html
      - type: APIReference
        url: https://trestle-documentation.corelogic.com/webapi-reference.html
      - type: GettingStarted
        url: https://trestle-documentation.corelogic.com/webapi.html
