- aid: corelogic:360-property-data
  name: 360 Property Data
  description: >-
    360 Property Data is Cotality's enterprise property data product covering structure, ownership, tax,
    mortgages, hazard risk, climate risk, and geospatial overlays across approximately 99% of U.S. residential
    properties. Delivery is via cloud data shares (AWS, Databricks, Google Cloud, Microsoft Azure, Snowflake)
    and SFTP rather than a self-service REST API; access is gated by enterprise sales contract. Sold to
    lenders, insurers, government, and proptech platforms.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.cotality.com/360-property-data
  tags:
  - Data Share
