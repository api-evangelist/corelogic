apis:
- aid: corelogic:trestle-rets
  name: Trestle RETS
  description: >-
    Trestle's RETS endpoint implements the RETS 1.8 specification on top of the same data catalog as the
    RESO Web API. The service is session-less; authentication uses HTTP Basic with client credentials
    or OAuth2 bearer tokens issued from /trestle/oidc/connect/token with scope=rets. Supported transactions
    include Login, GetMetadata, Search (up to 1000 records per request, default 10), and GetObject for
    media. The same RESO resources are exposed as RETS SearchType / Class names (Property, Member, Office,
    Teams, Media, Lookup). Digest authentication is not supported.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://trestle-documentation.corelogic.com/rets.html
  baseURL: https://api.cotality.com/trestle/rets
  tags:
  - Legacy
  - Listings
  - MLS
  - RETS
  - Trestle
  properties:
  - type: Documentation
    url: https://trestle-documentation.corelogic.com/rets.html
  - type: ClientLibraries
    url: https://trestle-documentation.corelogic.com/rets-libraries.html
  - type: Connector
    url: https://trestle-documentation.corelogic.com/rets-connector.html
- aid: corelogic:direct-webapi-mlo
  name: Direct Web API — MLO
  description: >-
    The Direct Web API MLO reference exposes Member Loan Officer / lender-side data from the Matrix MLS
    platform via OData. Used to integrate originator and loan-officer profiles, branches, and licensing
    data into third-party CRM and lead-routing systems.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://trestle-documentation.corelogic.com/direct-webapi-mlo-reference.html
  baseURL: https://api.cotality.com/trestle/odata
