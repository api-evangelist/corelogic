  - Tax Data
  properties:
  - type: Overview
    url: https://www.cotality.com/360-property-data
  - type: CloudDataShare
    url: https://www.cotality.com/360-property-data
- aid: corelogic:climate-risk-analytics
  name: Climate Risk Analytics
  description: >-
    Climate Risk Analytics (CRA) delivers parcel- and structure-level chronic climate risk indices and
    acute peril scores across the continental United States and the District of Columbia. Chronic Perils
    covers cold wave, heat wave, extreme precipitation, and drought via 84 indices, with IPCC SSP1-2.6,
    SSP2-4.5, SSP3-7.0, and SSP5-8.5 scenarios projected to 2030, 2040, and 2050. Acute Perils products
    cover wildfire, flood, hurricane, severe convective storm, and earthquake. Delivery is via AWS, Databricks,
    Google Cloud, Azure, Snowflake, and SFTP — semantic companion files ship alongside the data for AI/ML
    ingestion.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.cotality.com/360-property-data/climate-risk-analytics
  tags:
  - Catastrophe Models
  - Climate Risk
  - Data Share
  - IPCC
  - Insurance Data
  - Perils
